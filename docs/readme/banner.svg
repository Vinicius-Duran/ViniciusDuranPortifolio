<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="img" aria-label="Vinicius Duran, desenvolvedor full-stack em Florianopolis. React, Vite, GSAP e anime.js.">
  <title>Vinicius Duran — Desenvolvedor Full-Stack</title>

  <!--
    Mesmo sistema visual do site (src/index.css): carvao quente, um acento
    ambar, grotesk tecnica. A animacao repete a gramatica de montagem do
    portfolio: o quadro de wireframe e desenhado, o conteudo entra por dentro
    dele, e a guia se retira. Ciclo de 10s, em loop.

    Sem fonte externa: dentro de <img> o SVG nao carrega webfont, entao a
    pilha cai em Helvetica/Arial, que e a mesma familia de sensacao do Archivo.
  -->

  <defs>
    <style><![CDATA[
      .display { font-family: 'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 800; }
      .body    { font-family: 'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 500; }
      .mono    { font-family: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-weight: 500; }

      /* Tudo anima por transform e opacity. Nada de layout por frame. */
      .anim { transform-box: fill-box; }

      .guide {
        stroke-dasharray: 1860;
        stroke-dashoffset: 1860;
        animation: draw 10s cubic-bezier(0.23,1,0.32,1) infinite;
      }
      @keyframes draw {
        0%   { stroke-dashoffset: 1860; opacity: .95; }
        9%   { stroke-dashoffset: 0;    opacity: .95; }
        16%  { opacity: .95; }
        24%  { opacity: .34; }
        93%  { opacity: .34; }
        100% { opacity: 0; }
      }

      .tag { animation: tag 10s cubic-bezier(0.23,1,0.32,1) infinite; opacity: 0; }
      @keyframes tag {
        0%,6%  { opacity: 0; transform: translateY(6px); }
        12%    { opacity: 1; transform: translateY(0); }
        93%    { opacity: 1; transform: translateY(0); }
        100%   { opacity: 0; }
      }

      /* O nome e escrito da esquerda para a direita, como saida de compilador. */
      .wipe { transform-origin: left center; animation: wipe 10s cubic-bezier(0.77,0,0.175,1) infinite; }
      @keyframes wipe {
        0%,10% { transform: scaleX(0); }
        26%    { transform: scaleX(1); }
        100%   { transform: scaleX(1); }
      }

      .caret { transform-origin: left center; animation: caret 10s cubic-bezier(0.77,0,0.175,1) infinite; }
      @keyframes caret {
        0%,10% { transform: translateX(0);   opacity: 1; }
        26%    { transform: translateX(676px); opacity: 1; }
        30%    { transform: translateX(676px); opacity: 0; }
        100%   { transform: translateX(676px); opacity: 0; }
      }

      .rule { transform-origin: left center; animation: rule 10s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes rule {
        0%,24% { transform: scaleX(0); }
        34%    { transform: scaleX(1); }
        93%    { transform: scaleX(1); opacity: 1; }
        100%   { transform: scaleX(1); opacity: 0; }
      }

      .fade { opacity: 0; animation: fade 10s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes fade {
        0%   { opacity: 0; transform: translateY(10px); }
        30%  { opacity: 0; transform: translateY(10px); }
        38%  { opacity: 1; transform: translateY(0); }
        93%  { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; }
      }

      /* Coluna de build: uma linha por vez, como o leitor fixo do site. */
      .row { opacity: 0; animation: row 10s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes row {
        0%   { opacity: 0; transform: translateX(12px); }
        34%  { opacity: 0; transform: translateX(12px); }
        42%  { opacity: 1; transform: translateX(0); }
        93%  { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; }
      }
      .row-2 { animation-delay: .35s; }
      .row-3 { animation-delay: .70s; }
      .row-4 { animation-delay: 1.05s; }

      .pulse { animation: pulse 10s ease-in-out infinite; }
      @keyframes pulse {
        0%,44% { opacity: 0; }
        50%    { opacity: 1; }
        70%    { opacity: .35; }
        86%    { opacity: 1; }
        93%    { opacity: 1; }
        100%   { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .guide, .tag, .wipe, .caret, .rule, .fade, .row, .pulse {
          animation: none;
          opacity: 1;
          transform: none;
          stroke-dashoffset: 0;
        }
      }
    ]]></style>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="nameClip">
      <rect class="anim wipe" x="64" y="126" width="680" height="92"/>
    </clipPath>
  </defs>

  <!-- Piso: o carvao quente do site, nunca preto puro. -->
  <rect width="1200" height="360" fill="#14100c"/>
  <rect width="1200" height="360" fill="#221c18" opacity=".55"/>
  <rect width="1200" height="360" filter="url(#grain)" opacity=".055"/>
  <rect x="0" y="0" width="1200" height="360" fill="none" stroke="#efe8dc" stroke-opacity=".08"/>

  <!-- A guia de montagem: quadro de wireframe desenhado, depois recuado. -->
  <rect class="guide" x="48" y="104" width="712" height="152"
        fill="none" stroke="#d9743f" stroke-opacity=".85" stroke-width="1"/>
  <g class="tag anim">
    <text class="mono" x="48" y="92" font-size="13" fill="#d9743f" letter-spacing="1.6">h1 · vinicius-duran</text>
  </g>

  <!-- Nome: revelado por wipe, com o cursor de escrita na borda. -->
  <g clip-path="url(#nameClip)">
    <text class="display" x="64" y="196" font-size="76" letter-spacing="-2.4" fill="#efe8dc">VINICIUS DURAN</text>
  </g>
  <rect class="anim caret" x="64" y="132" width="10" height="76" fill="#d9743f"/>

  <rect class="anim rule" x="64" y="228" width="404" height="3" fill="#d9743f"/>

  <g class="fade anim">
    <text class="body" x="64" y="272" font-size="21" fill="#efe8dc" fill-opacity=".72">
      Desenvolvedor Full-Stack · Florianópolis, SC
    </text>
    <text class="mono" x="64" y="306" font-size="14" fill="#efe8dc" fill-opacity=".48" letter-spacing=".6">
      interfaces vivas, sistemas robustos
    </text>
  </g>

  <!-- Coluna de build: o que a pagina roda. -->
  <g>
    <line x1="856" y1="104" x2="856" y2="256" stroke="#efe8dc" stroke-opacity=".14"/>
    <g class="row anim">
      <text class="mono" x="880" y="122" font-size="14" fill="#efe8dc" fill-opacity=".78">react 19</text>
      <text class="mono" x="1136" y="122" font-size="14" fill="#d9743f" text-anchor="end">ok</text>
    </g>
    <g class="row row-2 anim">
      <text class="mono" x="880" y="156" font-size="14" fill="#efe8dc" fill-opacity=".78">vite 6</text>
      <text class="mono" x="1136" y="156" font-size="14" fill="#d9743f" text-anchor="end">ok</text>
    </g>
    <g class="row row-3 anim">
      <text class="mono" x="880" y="190" font-size="14" fill="#efe8dc" fill-opacity=".78">gsap 3.15</text>
      <text class="mono" x="1136" y="190" font-size="14" fill="#d9743f" text-anchor="end">ok</text>
    </g>
    <g class="row row-4 anim">
      <text class="mono" x="880" y="224" font-size="14" fill="#efe8dc" fill-opacity=".78">anime.js 4</text>
      <text class="mono" x="1136" y="224" font-size="14" fill="#d9743f" text-anchor="end">ok</text>
    </g>
    <text class="mono pulse" x="880" y="258" font-size="13" fill="#d9743f" fill-opacity=".85">build · montado</text>
  </g>
</svg>
