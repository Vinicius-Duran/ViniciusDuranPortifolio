<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 268" width="1200" height="268"
     role="img" aria-label="As tres gramaticas de animacao do site: a montagem, os trilhos horizontais e o baralho.">
  <title>Gramáticas de motion — montagem, trilho, baralho</title>

  <!--
    Uma vinheta por gramatica de src/lib/motion.js. Nao e enfeite: quem le o
    README ve o que a secao Motion descreve, em vez de imaginar.
  -->

  <defs>
    <style><![CDATA[
      .mono { font-family: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-weight: 500; }
      .anim { transform-box: fill-box; }

      /* 1. A montagem: o quadro e desenhado, o conteudo entra, a guia recua. */
      .m-frame {
        stroke-dasharray: 960; stroke-dashoffset: 960;
        animation: m-draw 8s cubic-bezier(0.23,1,0.32,1) infinite;
      }
      @keyframes m-draw {
        0%   { stroke-dashoffset: 960; opacity: .9; }
        16%  { stroke-dashoffset: 0;   opacity: .9; }
        30%  { opacity: .9; }
        44%  { opacity: .3; }
        92%  { opacity: .3; }
        100% { opacity: 0; }
      }
      .m-bar { transform-origin: left center; opacity: 0; animation: m-bar 8s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes m-bar {
        0%,20% { opacity: 0; transform: scaleX(0); }
        36%    { opacity: 1; transform: scaleX(1); }
        92%    { opacity: 1; transform: scaleX(1); }
        100%   { opacity: 0; transform: scaleX(1); }
      }
      .m-bar-2 { animation-delay: .28s; }
      .m-bar-3 { animation-delay: .56s; }

      /* 2. O trilho: rolagem vertical vira deslocamento horizontal. */
      .t-track { animation: t-slide 8s cubic-bezier(0.77,0,0.175,1) infinite alternate; }
      @keyframes t-slide {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-196px); }
      }
      .t-progress { transform-origin: left center; animation: t-prog 8s cubic-bezier(0.77,0,0.175,1) infinite alternate; }
      @keyframes t-prog {
        0%   { transform: scaleX(.08); }
        100% { transform: scaleX(1); }
      }

      /* 3. O baralho: a carta que sai recua por escurecimento, nunca por opacidade. */
      .d-card { transform-origin: center center; animation: d-stack 8s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes d-stack {
        0%,10% { transform: translateY(52px) scale(1); }
        34%    { transform: translateY(0) scale(1); }
        62%    { transform: translateY(-24px) scale(.92); }
        100%   { transform: translateY(-24px) scale(.92); }
      }
      .d-veil { opacity: 0; animation: d-veil 8s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes d-veil {
        0%,34% { opacity: 0; }
        62%    { opacity: .55; }
        100%   { opacity: .55; }
      }
      .d-card-2 { animation-delay: 1.1s; }
      .d-veil-2 { animation-delay: 1.1s; }

      .label { opacity: 0; animation: label 8s ease-out infinite; }
      @keyframes label {
        0%   { opacity: 0; }
        14%  { opacity: 1; }
        92%  { opacity: 1; }
        100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .m-frame, .m-bar, .t-track, .t-progress, .d-card, .d-veil, .label {
          animation: none; opacity: 1; transform: none; stroke-dashoffset: 0;
        }
        .d-veil { opacity: .35; }
      }
    ]]></style>

    <clipPath id="trackClip"><rect x="424" y="48" width="332" height="132"/></clipPath>
  </defs>

  <rect width="1200" height="268" fill="#14100c"/>
  <rect width="1200" height="268" fill="#221c18" opacity=".55"/>

  <!-- 1. A montagem -->
  <rect class="m-frame" x="44" y="48" width="332" height="132"
        fill="none" stroke="#d9743f" stroke-opacity=".85" stroke-width="1"/>
  <g>
    <rect class="anim m-bar"       x="72" y="80"  width="228" height="18" rx="6" fill="#efe8dc" fill-opacity=".88"/>
    <rect class="anim m-bar m-bar-2" x="72" y="112" width="276" height="10" rx="5" fill="#efe8dc" fill-opacity=".38"/>
    <rect class="anim m-bar m-bar-3" x="72" y="134" width="180" height="10" rx="5" fill="#efe8dc" fill-opacity=".38"/>
  </g>
  <text class="mono label" x="44" y="212" font-size="13" fill="#d9743f" letter-spacing="1.2">a montagem</text>
  <text class="mono label" x="44" y="234" font-size="12" fill="#efe8dc" fill-opacity=".45">assemblePart · buildIntro</text>

  <!-- 2. Os trilhos horizontais -->
  <rect x="424" y="48" width="332" height="132" fill="none" stroke="#efe8dc" stroke-opacity=".14"/>
  <g clip-path="url(#trackClip)">
    <g class="anim t-track">
      <rect x="444" y="72" width="120" height="84" rx="10" fill="#efe8dc" fill-opacity=".14" stroke="#efe8dc" stroke-opacity=".2"/>
      <rect x="580" y="72" width="120" height="84" rx="10" fill="#d9743f" fill-opacity=".22" stroke="#d9743f" stroke-opacity=".5"/>
      <rect x="716" y="72" width="120" height="84" rx="10" fill="#efe8dc" fill-opacity=".14" stroke="#efe8dc" stroke-opacity=".2"/>
      <rect x="852" y="72" width="120" height="84" rx="10" fill="#efe8dc" fill-opacity=".14" stroke="#efe8dc" stroke-opacity=".2"/>
    </g>
  </g>
  <rect x="444" y="166" width="292" height="2" fill="#efe8dc" fill-opacity=".12"/>
  <rect class="anim t-progress" x="444" y="166" width="292" height="2" fill="#d9743f"/>
  <text class="mono label" x="424" y="212" font-size="13" fill="#d9743f" letter-spacing="1.2">os trilhos</text>
  <text class="mono label" x="424" y="234" font-size="12" fill="#efe8dc" fill-opacity=".45">horizontalTrack · enterFromTrack</text>

  <!-- 3. O baralho -->
  <g>
    <rect x="828" y="118" width="292" height="62" rx="12" fill="#2b2420" stroke="#efe8dc" stroke-opacity=".16"/>
    <g class="anim d-card">
      <rect x="828" y="118" width="292" height="62" rx="12" fill="#382f29" stroke="#efe8dc" stroke-opacity=".2"/>
      <rect x="852" y="140" width="150" height="10" rx="5" fill="#efe8dc" fill-opacity=".5"/>
      <rect class="d-veil" x="828" y="118" width="292" height="62" rx="12" fill="#14100c"/>
    </g>
    <g class="anim d-card d-card-2">
      <rect x="828" y="118" width="292" height="62" rx="12" fill="#382f29" stroke="#d9743f" stroke-opacity=".45"/>
      <rect x="852" y="140" width="196" height="10" rx="5" fill="#d9743f" fill-opacity=".8"/>
      <rect class="d-veil d-veil-2" x="828" y="118" width="292" height="62" rx="12" fill="#14100c"/>
    </g>
  </g>
  <text class="mono label" x="828" y="212" font-size="13" fill="#d9743f" letter-spacing="1.2">o baralho</text>
  <text class="mono label" x="828" y="234" font-size="12" fill="#efe8dc" fill-opacity=".45">stackCards</text>
</svg>
